name: Bug report
description: Report a reproducible non-security problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a Bot Token, OTP, pairing link, Chat ID, full SMS, `.env`, state database, or unredacted log here.**
        For a possible security vulnerability, follow SECURITY.md and report it privately.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior using synthetic or redacted data only.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all credentials, OTPs, phone numbers, Chat IDs, message bodies, and pairing links.
          required: true
